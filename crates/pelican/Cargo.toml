[package]
name = "pelican"
description = "Sync your music to a Garmin watch over USB. No telemetry, no cloud."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["garmin", "mtp", "music", "sync", "linux"]
categories = ["multimedia", "command-line-utilities"]

[dependencies]
pelican-core = { path = "../pelican-core", version = "0.2.1", default-features = false }
anyhow.workspace = true
clap.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
default = ["mtp-backend"]
mtp-backend = ["pelican-core/mtp-backend"]

[lints]
workspace = true
