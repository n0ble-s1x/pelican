[workspace]
resolver = "2"
members = ["crates/pelican-core", "crates/pelican"]

# Shared package metadata. Both crates ship as one product, so version,
# licence and provenance live here rather than being kept in sync by hand.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n0ble-s1x/pelican"
homepage = "https://github.com/n0ble-s1x/pelican"
# Author: maintainer of this fork; copyright remains Krypteia LLC (see LICENSE-*).
authors = ["n0ble-s1x <krypteia.annex447@8alias.com>"]

[workspace.dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.34"
futures = "0.3"
id3 = "1.14"
libc = "0.2"
lofty = "0.25"
mp4ameta = "0.13"
mtp = { package = "mtp-rs", version = "0.13" }
nusb = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Deny `unsafe` in our own code — keeps the auditable surface tiny. We accept
# unsafe through dependencies (audited via cargo-deny) but not in ours, with
# the single documented exception in `pelican-core/src/platform/gvfs.rs`.
[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
