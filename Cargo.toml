[workspace]
resolver = "2"
members = ["crates/pelican-core", "crates/pelican", "crates/pelican-shell"]

# Shared package metadata. All three crates ship as one product, so version,
# license and provenance live here rather than being kept in sync by hand.
[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.89 for `std::fs::File::lock`, which the per-device ledger holds for the
# length of a run so two runs cannot hand out the same counter.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n0ble-s1x/pelican"
homepage = "https://github.com/n0ble-s1x/pelican"
# Author: maintainer of this fork; copyright remains Krypteia LLC (see LICENSE-*).
authors = ["n0ble-s1x <krypteia.annex447@8alias.com>"]

[workspace.dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
libc = "0.2"
lofty = "0.25"
mtp = { package = "mtp-rs", version = "0.13" }
nusb = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The window. Default features off: no brotli asset compression, no
# runtime-mutable ACL (`dynamic-acl`), no Windows controls, no X11-only or
# D-Bus extras; only wry over webkit2gtk. No Tauri plugin is used at all.
tauri = { version = "2.11", default-features = false, features = ["wry"] }
tauri-build = { version = "2.6", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Deny `unsafe` in our own code to keep the auditable surface small. We accept
# unsafe through dependencies (audited via cargo-deny) but not in ours, with
# the single documented exception in `pelican-core/src/platform/gvfs.rs`.
[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
