# Pelican: Flatpak manifest for the command-line tool only.
#
# It does not package the desktop app (pelican-app), which would need a
# runtime with webkit2gtk-4.1, such as org.gnome.Platform, and a desktop
# entry. It has never been built as committed.
#
# Test build locally:
#   flatpak install flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 org.freedesktop.Sdk.Extension.rust-stable//26.08
#   flatpak-builder --user --install build/ packaging/flatpak/com.krypteia.Pelican.yaml --force-clean
#   flatpak run com.krypteia.Pelican
#
# Submit to Flathub: https://docs.flathub.org/docs/for-app-authors/submission

app-id: com.krypteia.Pelican
runtime: org.freedesktop.Platform
# Freedesktop SDK 26.08 was released 2026-09-01. Check for a newer release
# before submitting, and run the local test build above.
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: pelican

finish-args:
  # Wayland + X11 fallback
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

  # Direct USB access for the Garmin watch (vendor 091e)
  - --device=usb=091e:*

  # Read access to music wherever it lives. Writes go to the watch over USB
  # and to the app's own data and cache dirs, plus the backup folder.
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:ro
  - --filesystem=host:ro
  - --filesystem=xdg-documents/Pelican:create

  # No network. Pelican is fully local. Locked down here so a compromised
  # dependency can't phone home from inside the sandbox.
  # (Flathub will warn that --share=network is not requested. That is
  # deliberate.)

modules:
  - name: ffmpeg
    config-opts:
      - --disable-doc
      - --disable-debug
      - --disable-network
      - --disable-static
      - --enable-shared
      - --enable-libmp3lame
    cleanup:
      - /share/ffmpeg/examples
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz
        sha256: 40973d44970dbc83ef302b0609f2e74982be2d85916dd2ee7472d30678a7abe6

  - name: pelican
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/pelican/cargo
    build-commands:
      - cargo build --release -p pelican --offline
      - install -Dm755 target/release/pelican /app/bin/pelican
      # No desktop entry: this manifest ships only the CLI, and
      # packaging/desktop/pelican.desktop launches pelican-app.
      - install -Dm644 packaging/flatpak/com.krypteia.Pelican.metainfo.xml /app/share/metainfo/com.krypteia.Pelican.metainfo.xml
      # No icon install line. packaging/flatpak/com.krypteia.Pelican.svg does
      # not exist yet (see packaging/flatpak/README.md), and `install -Dm644`
      # on a missing source is a hard build failure. Restore the line with the
      # icon, not before:
      #   - install -Dm644 packaging/flatpak/com.krypteia.Pelican.svg /app/share/icons/hicolor/scalable/apps/com.krypteia.Pelican.svg
    sources:
      - type: dir
        path: ../..
      # Cargo sources for the offline build, generated before submission by
      # flatpak-cargo-generator.py (flatpak-builder-tools). Flathub builds
      # offline, so this file is required there.
      # - type: file
      #   path: cargo-sources.json
