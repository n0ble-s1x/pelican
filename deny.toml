[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

# Informational advisories — `unmaintained` and `unsound`. There is no
# allowlisted *vulnerability* here or anywhere in this repo.
#
# The reasoning for every ID below lives in `.cargo/audit.toml`, crate by
# crate, and is not duplicated here. Both tools scan the same lockfile and
# both flag informational advisories (cargo-deny 0.18 does so by default),
# so both need the list; only one of them needs to carry the argument.
#
# Keep the two in step. If you add an ID here without an entry there, you
# have silenced something without saying why.
ignore = [
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2024-0370", # proc-macro-error — build-time only, via glib-macros
    "RUSTSEC-2024-0429", # glib 0.18 — unsound VariantStrIter, never called
]

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    # MPL-2.0 — arrives with Tauri, and accepted deliberately.
    #
    #   cssparser, cssparser-macros, selectors, dtoa-short
    #       Servo's CSS parser, via tauri-utils. It is what parses and
    #       rewrites the CSP `tauri.conf.json` declares.
    #   option-ext
    #       via dirs.
    #
    # MPL-2.0 is file-level copyleft, not viral: it obliges publishing
    # modifications *to those files* and permits combining them into a
    # larger work under another licence. Pelican ships them unmodified as
    # ordinary crates.io dependencies. OSI-approved and FSF-free. This stops
    # being free of obligation the moment one of them is vendored and
    # patched — the patch must then be published under MPL-2.0.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
